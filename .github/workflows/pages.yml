name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/Dames.Web -c Release -o publish

      - name: Point the app at the repository subpath
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      # Les noms des fichiers du runtime portent une empreinte que le SDK réécrit dans
      # index.html. Une référence oubliée ne casse pas la publication : elle laisse la
      # page bloquée sur l'écran d'amorçage. On vérifie donc avant de déployer.
      - name: Check every asset referenced by the page was published
        run: |
          node -e '
          const fs = require("fs");
          const root = "publish/wwwroot";
          // On ignore le <base>, les liens absolus et les chemins de dossier : on ne
          // veut que les fichiers que la page va réellement télécharger.
          const html = fs.readFileSync(root + "/index.html", "utf8").replace(/<base [^>]*>/g, "");
          const refs = new Set();
          for (const m of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
            const ref = m[1];
            if (/^(https?:|\/\/|#|\.$)/.test(ref) || ref.endsWith("/")) continue;
            refs.add(ref);
          }
          const map = html.match(/<script type="importmap">([\s\S]*?)<\/script>/);
          if (!map || !map[1].trim()) throw new Error("carte d\x27import absente d\x27index.html");
          for (const v of Object.values(JSON.parse(map[1]).imports || {})) refs.add(v.replace(/^\.\//, ""));
          const missing = [...refs].filter(r => !fs.existsSync(root + "/" + r.replace(/^\//, "")));
          if (missing.length) throw new Error("références absentes du site publié : " + missing.join(", "));
          console.log(refs.size + " références vérifiées.");
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - id: deploy
        uses: actions/deploy-pages@v4
